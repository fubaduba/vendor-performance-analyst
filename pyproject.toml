[project]
name = "vendor-performance-analyst"
version = "0.1.0"
description = "BRK252 Act II demo agent — vendor performance analysis on Foundry."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-agentserver-responses==1.0.0b5",
    "azure-ai-agentserver-core==2.0.0b3",
    "azure-ai-projects==2.0.1",
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry>=1.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
