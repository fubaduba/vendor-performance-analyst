name: vendor-performance-analyst
metadata:
  template: foundry-hosted-agent@1.0
  description: |
    BRK252 Act II demo agent. Vendor performance analyst built on the Foundry
    Agent Service. Used to demonstrate the code-first observability loop:
    eval -> diagnose -> traces-to-dataset -> single-shot optimization -> compare.

services:
  agent:
    project: agent
    language: py
    host: foundry-hosted-agent
    config:
      agent_name: vendor-performance-analyst
      model_env_var: MODEL_DEPLOYMENT_NAME
      system_prompt_env_var: SYSTEM_PROMPT_TEXT
      tools_module: agent.agent:AGENT_TOOLS

hooks:
  postdeploy:
    shell: sh
    run: python scripts/seed_traces.py --count 30
