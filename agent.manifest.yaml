# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: vendor-performance-analyst
displayName: "Vendor Performance Analyst"
description: >
  Vendor performance analyst for Microsoft data center operations. Tracks
  contractor performance across dispatches, SLA records, communications, and
  incident outcomes, and returns a calibrated verdict + recommendation.

metadata:
  tags:
    - AI Agent Hosting
    - Responses Protocol
    - Bring Your Own
    - Function Calling
    - Python

parameters:
  properties: []

template:
  name: vendor-performance-analyst
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    # FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING are
    # injected by the platform at runtime — do NOT declare them here.
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: AGENT_VERSION
      value: "v1"

resources:
  - kind: model
    id: gpt-4o
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
