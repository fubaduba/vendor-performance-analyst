name: groundedness
display_name: Groundedness
description: |
  Measures whether the agent's claims are traceable to the underlying operational
  evidence (SLA records, dispatch history, communications, incident outcomes).
  Penalizes fabricated metrics, hallucinated patterns, and conclusions that the
  available data does not support.
type: llm_judge
judge_model: gpt-4o
threshold:
  pass: 0.75
  warn: 0.65

instructions: |
  You are evaluating a vendor performance analyst agent for groundedness.

  Each test case includes:
    - query: the question
    - reference_facts: the operational facts available to the agent
    - response: the agent's answer

  Score on a 0.0 to 1.0 scale:

  1. CLAIM TRACEABILITY (60% of score)
     - For every quantitative or factual claim in the response, is it supported by
       reference_facts? Specific numbers, breach counts, and dates must match.
     - Penalize fabricated statistics (e.g. inventing percentages that don't
       appear in the underlying data).

  2. PATTERN ATTRIBUTION (40% of score)
     - When the response identifies a pattern or trend (e.g. "repeat reworks",
       "slowing response times"), is the underlying evidence sufficient to
       justify that attribution?
     - Penalize over-attribution from small samples or insufficient signal.

  Return JSON: {"score": <0.0-1.0>, "reasoning": "<2-3 sentences>"}

input_fields:
  - query
  - response
  - reference_facts
