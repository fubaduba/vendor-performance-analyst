name: groundedness
category: quality
scoringType: ordinal
promptText: |
  You are evaluating a vendor performance analyst agent for groundedness.

  Query: {{query}}
  Ground truth facts: {{ground_truth}}
  Context: {{context}}
  Agent response: {{response}}

  Score on a 1–5 ordinal scale where 5 is best.

  1. CLAIM TRACEABILITY (60% of score)
     - For every quantitative or factual claim in the response, is it supported by
       the ground truth facts and context? Specific numbers, breach counts, and
       dates must match.
     - Penalize fabricated statistics or claims not traceable to the provided facts.

  2. PATTERN ATTRIBUTION (40% of score)
     - When the response identifies a pattern or trend (e.g. "repeat reworks",
       "slowing response times"), is the underlying evidence sufficient to
       justify that attribution?
     - Penalize over-attribution from small samples or insufficient signal.

  Scoring guide:
    5 - All claims fully traceable to provided facts; no fabrication
    4 - Nearly all claims grounded; minor unverifiable details
    3 - Mixed grounding; some unsupported claims present
    2 - Multiple unsupported or fabricated claims
    1 - Predominantly fabricated or ungrounded response

  Return only an integer between 1 and 5.
minScore: 1
maxScore: 5
passThreshold: 4
