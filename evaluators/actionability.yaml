name: actionability
category: quality
scoringType: ordinal
promptText: |
  You are evaluating a vendor performance analyst agent for actionability.

  Query: {{query}}
  Expected behavior: {{ground_truth}}
  Context: {{context}}
  Agent response: {{response}}

  Score on a 1–5 ordinal scale where 5 is best.

  1. CONCRETENESS (50% of score)
     - Does the response give the vendor manager something specific they can do
       (escalate, monitor, request data, schedule a review, draft a PIP)?
     - Vague advice like "consider monitoring" should be penalized; specific
       actions like "request the crew certification audit referenced in the
       Mar 14 thread" should be rewarded.

  2. CONTEXT FIT (50% of score)
     - Does the recommendation fit the question? (A renewal question should get
       a renewal-relevant recommendation; a quality concern should get a
       quality-relevant recommendation.)

  Recommendations to pull more data are valid actions when evidence is
  insufficient. Do not penalize "recommend pulling Teams history" as
  hedging — it is a concrete action.

  Scoring guide:
    5 - Fully actionable, concrete recommendations directly fitting the query
    4 - Mostly actionable with only minor gaps
    3 - Partially actionable or context fit is weak
    2 - Vague recommendations with little practical use
    1 - No actionable recommendations provided

  Return only an integer between 1 and 5.
minScore: 1
maxScore: 5
passThreshold: 4
